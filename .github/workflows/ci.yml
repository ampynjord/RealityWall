name: CI et publication de l'extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    name: Tests de l'extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Lancer la suite de tests
        run: node --test test/*.test.js

  package:
    name: Empaqueter l'extension
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Valider manifest.json
        run: python3 -c "import json; json.load(open('extension/manifest.json'))"

      - name: Vérifier la syntaxe des scripts de l'extension
        run: for f in extension/prompts.js extension/core.js extension/context.js extension/background.js extension/content.js extension/options/options.js; do node -c "$f"; done

      - name: Lire la version de l'extension
        id: version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('extension/manifest.json'))['version'])" | tr -d '[:space:]')
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "::error::Version invalide dans manifest.json : '$VERSION' (format attendu : 1 à 4 entiers séparés par des points, ex. 1.0.0)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Créer les archives de l'extension (une par plateforme)
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          (cd extension && zip -rq "../dist/realitywall-extension-chrome-v${VERSION}.zip" . -x ".*")
          cp "dist/realitywall-extension-chrome-v${VERSION}.zip" \
             "dist/realitywall-extension-firefox-desktop-v${VERSION}.xpi"
          cp "dist/realitywall-extension-chrome-v${VERSION}.zip" \
             "dist/realitywall-extension-firefox-android-v${VERSION}.xpi"
          ls -la dist/

      - name: Publier les archives comme artifacts du run
        uses: actions/upload-artifact@v4
        with:
          name: realitywall-extension
          path: |
            dist/*.zip
            dist/*.xpi
          retention-days: 90

  release:
    name: Publier la release GitHub
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: realitywall-extension
          path: dist

      - name: Créer ou mettre à jour la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          TAG="extension-v${VERSION}"
          NOTES="Extension RealityWall prête à télécharger et installer, un package par plateforme (contenu identique, seul le nom change) :

          - **Chrome / Edge / Brave** : \`realitywall-extension-chrome-v${VERSION}.zip\` — décompressez puis « Charger l'extension non empaquetée ».
          - **Firefox desktop** : \`realitywall-extension-firefox-desktop-v${VERSION}.xpi\` — chargez directement via about:debugging → « Charger un module complémentaire temporaire ».
          - **Firefox Android** : \`realitywall-extension-firefox-android-v${VERSION}.xpi\` — contenu identique au paquet Firefox desktop, à charger via le pont de débogage distant (voir le README).

          Voir le README pour les instructions détaillées."

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/*.xpi --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "$NOTES"
          else
            gh release create "$TAG" dist/*.zip dist/*.xpi \
              --repo "$GITHUB_REPOSITORY" \
              --title "RealityWall extension v${VERSION}" \
              --notes "$NOTES"
          fi
