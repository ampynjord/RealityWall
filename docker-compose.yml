services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: realitywall-backend:latest
    container_name: realitywall-backend
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.realitywall.rule=Host(`${DOMAIN:-realitywall.ampynjord.bzh}`)"
      - "traefik.http.routers.realitywall.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.realitywall.tls=true"
      - "traefik.http.routers.realitywall.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.realitywall.loadbalancer.server.port=8000"

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
